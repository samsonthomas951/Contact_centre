version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      otel:
        patterns:
          - go.opentelemetry.io/*
      prometheus:
        patterns:
          - github.com/prometheus/*
      pgx:
        patterns:
          - github.com/jackc/*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
