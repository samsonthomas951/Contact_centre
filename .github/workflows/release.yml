name: release

# Publishes one image per cmd/* binary to ghcr.io on every push to
# main and on every semver tag. Pull requests build the images but
# don't push, so we still get the layer-cache + Trivy result.
#
# Image hardening checklist (per docs/security/pentest-readiness.md):
#   - distroless static base
#   - nonroot user (65532)
#   - Trivy CVE scan blocks HIGH/CRITICAL
#   - Cosign keyless signs the digest, then attests the SBOM
#
# The Helm charts in deploy/k8s reference ghcr.io/${OWNER}/contact-centre/<bin>
# at the tag the chart appVersion pins.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write          # ghcr push
  id-token: write          # cosign keyless OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      bins: ${{ steps.list.outputs.bins }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # Discover every cmd subdirectory so a new binary is picked up
        # without editing this workflow.
        run: |
          set -euo pipefail
          bins=$(ls -1 cmd | jq -R . | jq -sc .)
          echo "bins=$bins" >> "$GITHUB_OUTPUT"
          echo "discovered: $bins"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binary: ${{ fromJson(needs.matrix.outputs.bins) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.0.0+sha.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Compute image name
        id: img
        run: |
          owner_lc=$(echo "${{ env.IMAGE_OWNER }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${owner_lc}/contact-centre/${{ matrix.binary }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr (push only on main / tag)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR) / Build & push (main + tag)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          build-args: |
            BINARY=${{ matrix.binary }}
            VERSION=${{ steps.ver.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (block HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
        # On PR the image is loaded into the local docker daemon so
        # Trivy can scan it. On main/tag we scan the just-pushed image
        # via the registry.

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign (keyless OIDC)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
